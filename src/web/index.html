<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Super Agent</title>
	<style>
		:root {
			--bg: #f7f5f0; --panel: #fff; --ink: #1c1b19; --muted: #5f5c56; --line: #e6e2d9; --track: #ece8df;
			--accent: #3b5bdb; --accent-ink: #2b44a8; --accent-bg: #edf1ff;
			--ok: #2f9e44; --ok-ink: #22703a; --ok-bg: #eaf6ec;
			--warn: #e8590c; --warn-ink: #a3400a; --warn-bg: #fff4ea; --warn-line: #f8cfae;
			--bad-ink: #b3261e; --bad-bg: #fdecea;
			--shadow: 0 2px 10px rgba(28, 27, 25, 0.06);
			color-scheme: light;
		}
		@media (prefers-color-scheme: dark) {
			:root:not([data-theme="light"]) {
				--bg: #15161a; --panel: #1e2026; --ink: #ecebe7; --muted: #a9a7a1; --line: #30323a; --track: #2b2d34;
				--accent: #5c7cfa; --accent-ink: #b4c3ff; --accent-bg: #262c45;
				--ok: #51cf66; --ok-ink: #a6e9b1; --ok-bg: #1f3326;
				--warn: #ff8a3d; --warn-ink: #ffb98a; --warn-bg: #2e2219; --warn-line: #5a3a22;
				--bad-ink: #f2867e; --bad-bg: #3a1f1d;
				--shadow: none;
				color-scheme: dark;
			}
		}
		:root[data-theme="dark"] {
			--bg: #15161a; --panel: #1e2026; --ink: #ecebe7; --muted: #a9a7a1; --line: #30323a; --track: #2b2d34;
			--accent: #5c7cfa; --accent-ink: #b4c3ff; --accent-bg: #262c45;
			--ok: #51cf66; --ok-ink: #a6e9b1; --ok-bg: #1f3326;
			--warn: #ff8a3d; --warn-ink: #ffb98a; --warn-bg: #2e2219; --warn-line: #5a3a22;
			--bad-ink: #f2867e; --bad-bg: #3a1f1d;
			--shadow: none;
			color-scheme: dark;
		}
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 14px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", "Helvetica Neue", system-ui, sans-serif; }
		button { font: inherit; cursor: pointer; }
		.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

		header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px 28px; background: var(--panel); border-bottom: 1px solid var(--line); }
		.logo { width: 36px; height: 36px; border-radius: 12px; background: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
		.brand { display: flex; flex-direction: column; }
		.brand strong { font-size: 16px; }
		.brand span { font-size: 12px; color: var(--muted); }
		.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 12px; border-radius: 999px; }
		.chip:empty { display: none; }
		#duty { color: var(--ok-ink); background: var(--ok-bg); }
		#duty::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--ok); }
		#restart { color: var(--accent-ink); background: var(--accent-bg); }
		#status { color: var(--warn-ink); background: var(--warn-bg); }
		#status[data-status="connected"] { display: none; }
		#status[data-status="expired"] { color: var(--bad-ink); background: var(--bad-bg); }
		.spacer { flex: 1; }
		#theme { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; }

		.columns { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr) minmax(300px, 380px); }
		#left { overflow-y: auto; padding: 22px 18px; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--line); }
		#left section { display: flex; flex-direction: column; gap: 10px; }
		#left h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
		#left h2.warn { color: var(--warn-ink); }
		.empty { font-size: 12px; color: var(--muted); margin: 0; }
		.card { display: block; width: 100%; text-align: left; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
		.card.ask { background: var(--warn-bg); border-color: var(--warn-line); }
		.card[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: -1px; }
		.card .title { font-size: 14px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
		.card .why, .card .latest { font-size: 12px; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; white-space: pre-wrap; }
		.card.ask .latest { color: var(--ink); font-size: 13px; }
		.card .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
		.card .row .spacer { flex: 1; }
		.stop { font-size: 12px; min-height: 28px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
		.watch { display: flex; align-items: flex-start; gap: 10px; padding: 4px; }
		.watch::before { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--ok); margin-top: 6px; flex: none; }
		.watch .name { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
		.watch .rule { font-size: 12px; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
		#today .headline { font-size: 13px; font-weight: 600; }
		#today .detail { font-size: 12px; color: var(--muted); }
		#done summary { font-size: 13px; color: var(--muted); cursor: pointer; }
		#done .list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
		#done .card { opacity: 0.75; padding: 10px 12px; }

		main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
		#conversation { flex: 1; overflow-y: auto; padding: 22px 32px; }
		.thread { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
		.line { display: flex; gap: 10px; align-items: flex-start; }
		.line.user { justify-content: flex-end; }
		.avatar { width: 30px; height: 30px; border-radius: 10px; background: var(--accent); flex: none; }
		.bubble { max-width: 78%; padding: 11px 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
		.user .bubble { background: var(--accent); color: #fff; border-radius: 18px 18px 6px 18px; }
		.router .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 6px 18px 18px 18px; }
		.welcome { text-align: center; font-size: 12px; color: var(--muted); }
		form { padding: 12px 32px 24px; max-width: 844px; width: 100%; margin: 0 auto; }
		.composer { display: flex; gap: 10px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 10px 10px 18px; box-shadow: var(--shadow); }
		#composer { flex: 1; border: 0; outline: none; resize: none; font: inherit; font-size: 14px; line-height: 1.6; background: transparent; color: var(--ink); max-height: 30vh; }
		#send { font-size: 14px; font-weight: 600; min-height: 44px; padding: 0 20px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; }
		#send:disabled { opacity: 0.6; cursor: default; }
		#say-status { font-size: 12px; color: var(--muted); margin-top: 8px; }
		#say-status[data-state="delivered"] { color: var(--ok-ink); }
		#say-status[data-state="maybe_lost"], #say-status[data-state="rejected"] { color: var(--warn-ink); }
		#say-status[data-state="expired"] { color: var(--bad-ink); }

		#how { overflow-y: auto; border-left: 1px solid var(--line); padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; }
		.label { font-size: 12px; color: var(--muted); }
		#how-title { font-size: 16px; font-weight: 700; margin-top: 4px; line-height: 1.4; overflow-wrap: anywhere; }
		#how-title:empty, #how-meta:empty { display: none; }
		#how-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
		#steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
		.step { display: flex; gap: 12px; }
		.rail { display: flex; flex-direction: column; align-items: center; }
		.mark { width: 22px; height: 22px; border-radius: 999px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; background: var(--ok-bg); color: var(--ok-ink); flex: none; }
		.step.pending .mark { background: var(--accent-bg); color: var(--accent-ink); }
		.step.error .mark { background: var(--bad-bg); color: var(--bad-ink); }
		.rail::after { content: ""; width: 2px; flex: 1; min-height: 14px; background: var(--track); }
		.step-body { padding-bottom: 14px; min-width: 0; flex: 1; }
		.step-title { font-size: 14px; font-weight: 600; }
		.step-detail { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
		.step-detail:empty { display: none; }
		.step details { margin-top: 4px; }
		.step summary { font-size: 12px; color: var(--muted); cursor: pointer; }
		.step pre { margin: 6px 0 0; padding: 8px 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow-y: auto; }
		#small-print { margin-top: auto; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
		#small-print:empty { display: none; }

		@media (max-width: 900px) {
			.columns { display: flex; flex-direction: column; overflow-y: auto; }
			#left, #how { border: 0; border-bottom: 1px solid var(--line); overflow: visible; }
			#conversation { overflow: visible; padding: 16px; }
			main { min-height: 70vh; }
			header, form { padding-left: 16px; padding-right: 16px; }
		}
	</style>
</head>
<body>
	<header>
		<div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></div>
		<div class="brand"><strong>Super Agent</strong><span>你的 24 小时助理</span></div>
		<span id="duty" class="chip"></span>
		<span id="restart" class="chip"></span>
		<span id="status" class="chip" data-status="connecting">连接中…</span>
		<div class="spacer"></div>
		<button id="theme" type="button" aria-label="切换浅色或深色"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
	</header>
	<div class="columns">
		<aside id="left" aria-label="概况"></aside>
		<main aria-label="对话">
			<div id="conversation"><div class="thread"><div class="welcome">它一直在线：替你盯着消息，在后台让助手办事，只在需要你时来找你。</div></div></div>
			<form id="say" autocomplete="off">
				<label for="composer" class="sr">交给它一件事</label>
				<div class="composer">
					<textarea id="composer" rows="2" placeholder="交给它一件事，比如：帮我读一下 example.com 的网页标题"></textarea>
					<button id="send" type="submit">交给它</button>
				</div>
				<div id="say-status" data-state="idle" aria-live="polite">它会在后台去做，做完或需要你拿主意时再来找你。</div>
			</form>
		</main>
		<aside id="how" aria-label="它是怎么做的">
			<div>
				<div class="label">它是怎么做的</div>
				<div id="how-title"></div>
				<div id="how-meta"></div>
			</div>
			<ol id="steps"></ol>
			<div id="small-print"></div>
		</aside>
	</div>
	<script type="module" src="/app.mjs?token={{token}}"></script>
</body>
</html>
