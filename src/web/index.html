<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Super Agent</title>
	<style>
		:root {
			--bg: #f6f6f4; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
			--user: #e8f0fe; --ok: #1e7f4f; --bad: #b3261e; --warn: #9a6700;
			color-scheme: light dark;
		}
		@media (prefers-color-scheme: dark) {
			:root { --bg: #161616; --panel: #1f1f1f; --text: #e8e8e3; --muted: #9a9a94; --line: #333; --user: #1f2b40; --ok: #5cc28c; --bad: #f2867e; --warn: #e0b04a; }
		}
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
		header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
		h1 { margin: 0; font-size: 16px; }
		#status { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; color: var(--muted); }
		#status[data-status="connected"] { color: var(--ok); }
		#status[data-status="disconnected"] { color: var(--warn); }
		#status[data-status="expired"] { color: var(--bad); }
		main { flex: 1; display: grid; grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); min-height: 0; }
		#conversation { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
		#board { overflow-y: auto; padding: 16px; border-left: 1px solid var(--line); background: var(--panel); }
		.line { max-width: 85%; padding: 8px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
		.line.user { align-self: flex-end; background: var(--user); }
		.who { display: block; font-size: 12px; color: var(--muted); }
		.text, .summary, .title { white-space: pre-wrap; overflow-wrap: anywhere; }
		#board h2 { margin: 0 0 12px; font-size: 14px; color: var(--muted); font-weight: 600; }
		.card { padding: 10px 12px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 8px; }
		.card .head { display: flex; gap: 8px; align-items: baseline; }
		.card .id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
		.card .title { flex: 1; font-weight: 600; }
		.card .stage { font-size: 13px; white-space: nowrap; }
		.card.running .stage { color: var(--ok); }
		.card.awaiting_answer .stage, .card.awaiting_review .stage { color: var(--warn); }
		.card.blocked_or_failed .stage { color: var(--bad); }
		.card.closed, .card.stopped { opacity: 0.6; }
		.summary, .meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
		.hidden, .empty { font-size: 13px; color: var(--muted); }
		@media (max-width: 720px) {
			main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
			#board { border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
		}
	</style>
</head>
<body>
	<header><h1>Super Agent</h1><span id="status" data-status="connecting">连接中…</span></header>
	<main>
		<section id="conversation" aria-label="对话"></section>
		<aside id="board" aria-label="看板"></aside>
	</main>
	<script type="module" src="/app.mjs?token={{token}}"></script>
</body>
</html>
