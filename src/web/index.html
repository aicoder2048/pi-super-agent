<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pi Super Agent</title>
	<link rel="icon" href="/icon.svg" type="image/svg+xml">
	<style>
		:root {
			color-scheme: light dark;
			--bg: light-dark(#f7f5f0, #15161a); --panel: light-dark(#fff, #1e2026); --ink: light-dark(#1c1b19, #ecebe7); --muted: light-dark(#5f5c56, #a9a7a1); --line: light-dark(#e6e2d9, #30323a); --track: light-dark(#ece8df, #2b2d34);
			--accent: light-dark(#3b5bdb, #5c7cfa); --accent-ink: light-dark(#2b44a8, #b4c3ff); --accent-bg: light-dark(#edf1ff, #262c45);
			--ok: light-dark(#2f9e44, #51cf66); --ok-ink: light-dark(#22703a, #a6e9b1); --ok-bg: light-dark(#eaf6ec, #1f3326);
			--warn: light-dark(#e8590c, #ff8a3d); --warn-ink: light-dark(#a3400a, #ffb98a); --warn-bg: light-dark(#fff4ea, #2e2219); --warn-line: light-dark(#f8cfae, #5a3a22);
			--bad-ink: light-dark(#b3261e, #f2867e); --bad-bg: light-dark(#fdecea, #3a1f1d);
			--brand: light-dark(#1f2a44, #34456f); --brand-ring: light-dark(transparent, #5a6b96);
			--shadow: 0 2px 10px light-dark(rgba(28, 27, 25, 0.06), transparent);
		}
		:root[data-theme="light"] { color-scheme: light; }
		:root[data-theme="dark"] { color-scheme: dark; }
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 14px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", "Helvetica Neue", system-ui, sans-serif; }
		button { font: inherit; cursor: pointer; }
		.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
		/* A .sr inside a pane must take the pane as its containing block, or it sits below the fold and scrolls the page. */
		#left, #conversation, #how { position: relative; }

		header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px 28px; background: var(--panel); border-bottom: 1px solid var(--line); }
		.mark-bg { fill: var(--brand); }
		.logo { width: 36px; height: 36px; border-radius: 9px; box-shadow: 0 0 0 1px var(--brand-ring); flex: none; }
		.brand { display: flex; flex-direction: column; }
		.brand strong { font-size: 16px; }
		.brand span { font-size: 12px; color: var(--muted); }
		.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 12px; border-radius: 999px; }
		.chip:empty { display: none; }
		#duty { color: var(--ok-ink); background: var(--ok-bg); }
		#duty::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--ok); }
		#restart { color: var(--accent-ink); background: var(--accent-bg); }
		#status { color: var(--warn-ink); background: var(--warn-bg); }
		#status[data-status="connected"] { display: none; }
		#status[data-status="expired"] { color: var(--bad-ink); background: var(--bad-bg); }
		.spacer { flex: 1; }
		#theme { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; }

		#helpers { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 28px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
		#helpers .total { margin-left: auto; flex: none; font-size: 12px; color: var(--muted); white-space: nowrap; }
		.helper-slot { flex: none; max-width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
		.helper-slot .members { display: flex; flex-wrap: wrap; gap: 4px; padding-left: 10px; }
		.helper-slot .members:empty { display: none; }
		.member-chip { padding: 0 8px; border-radius: 999px; background: var(--accent-bg); color: var(--accent-ink); font-size: 11px; line-height: 18px; white-space: nowrap; }
		.member-chip.queued { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
		.helper-chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 12px; white-space: nowrap; }
		.helper-chip[aria-current="true"] { border-color: var(--accent); background: var(--accent-bg); }
		.helper-chip .name { font-size: 13px; font-weight: 600; }
		.helper-chip .role, .helper-chip .meta { color: var(--muted); }
		.helper-chip .dot { font-size: 11px; color: var(--muted); }
		.helper-chip .dot[data-duty="running"] { color: var(--ok); }
		.helper-chip .dot[data-duty="idle"] { color: var(--accent); }

		.columns { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr) minmax(300px, 380px); }
		#left { overflow-y: auto; padding: 22px 18px; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--line); }
		#left section { display: flex; flex-direction: column; gap: 10px; }
		#left h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
		#left h2.warn { color: var(--warn-ink); }
		.empty { font-size: 12px; color: var(--muted); margin: 0; }
		.card { display: block; width: 100%; text-align: left; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
		.card.ask { background: var(--warn-bg); border-color: var(--warn-line); }
		.card[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: -1px; }
		.helper { width: 22px; height: 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: none; }
		.helper svg { width: 13px; height: 13px; }
		.tint-0 { background: light-dark(#e7ecff, #262c45); color: light-dark(#3b5bdb, #91a7ff); }
		.tint-1 { background: light-dark(#fff0e0, #3a2618); color: light-dark(#d9480f, #ffa94d); }
		.tint-2 { background: light-dark(#e6f6ea, #1f3326); color: light-dark(#2b8a3e, #69db7c); }
		.tint-3 { background: light-dark(#f3f0ff, #2c2445); color: light-dark(#7048e8, #b197fc); }
		.tint-4 { background: light-dark(#e3fafc, #163236); color: light-dark(#0c8599, #66d9e8); }
		.tint-5 { background: light-dark(#fff0f6, #3a1d2a); color: light-dark(#c2255c, #faa2c1); }
		.card .head { display: flex; align-items: flex-start; gap: 8px; }
		.card .title { font-size: 14px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
		.card .by { font-size: 12px; color: var(--accent-ink); margin-top: 4px; }
		.card .by:empty, #how-helper:empty, #how-life:empty { display: none; }
		.card .why, .card .latest { font-size: 12px; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; white-space: pre-wrap; }
		.card.ask .latest { color: var(--ink); font-size: 13px; }
		.card .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
		.card .row .spacer { flex: 1; }
		.choices { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
		.choices:empty { display: none; }
		.choices button { font-size: 13px; min-height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--panel); color: var(--accent-ink); }
		.choices button:disabled { cursor: default; border-color: var(--line); color: var(--muted); }
		.choices button[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
		.choices .note { font-size: 12px; color: var(--muted); }
		.stop { font-size: 12px; min-height: 28px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
		.watch { display: flex; align-items: flex-start; gap: 10px; padding: 4px; }
		.watch::before { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--ok); margin-top: 6px; flex: none; }
		.watch.problem::before { background: var(--warn); }
		.watch .name { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
		.watch .rule { font-size: 12px; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
		#today .headline { font-size: 13px; font-weight: 600; }
		#today .detail { font-size: 12px; color: var(--muted); }
		#done summary { font-size: 13px; color: var(--muted); cursor: pointer; }
		#done .list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
		#done .card { opacity: 0.75; padding: 10px 12px; }

		main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
		#conversation { flex: 1; overflow-y: auto; padding: 22px 32px; }
		.thread { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
		.line { display: flex; gap: 10px; align-items: flex-start; }
		.line.user { justify-content: flex-end; }
		.avatar { width: 32px; height: 32px; border-radius: 50%; box-shadow: 0 0 0 1px var(--brand-ring); flex: none; }
		.bubble { max-width: 78%; padding: 11px 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
		.user .bubble { background: var(--accent); color: #fff; border-radius: 18px 18px 6px 18px; }
		.who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
		.router .said { min-width: 0; max-width: 78%; }
		.user .said { min-width: 0; max-width: 78%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
		.user .said .bubble { max-width: none; }
		.route { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; padding: 0 4px; text-align: right; }
		.route-slot:empty { display: none; }
		button.route { cursor: pointer; }
		button.route:hover { color: var(--accent-ink); text-decoration: underline; }
		.router .bubble { max-width: none; }
		.router .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 6px 18px 18px 18px; }
		.welcome { text-align: center; font-size: 12px; color: var(--muted); }
		form { padding: 12px 32px 24px; max-width: 844px; width: 100%; margin: 0 auto; }
		.composer { display: flex; gap: 10px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 10px 10px 18px; box-shadow: var(--shadow); }
		#composer { flex: 1; border: 0; outline: none; resize: none; font: inherit; font-size: 14px; line-height: 1.6; background: transparent; color: var(--ink); max-height: 30vh; }
		#send { font-size: 14px; font-weight: 600; min-height: 44px; padding: 0 20px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; }
		#send:disabled { opacity: 0.6; cursor: default; }
		#say-status { font-size: 12px; color: var(--muted); margin-top: 8px; }
		#say-status[data-state="delivered"] { color: var(--ok-ink); }
		#say-status[data-state="maybe_lost"], #say-status[data-state="rejected"] { color: var(--warn-ink); }
		#say-status[data-state="expired"] { color: var(--bad-ink); }

		#how { overflow-y: auto; border-left: 1px solid var(--line); padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; }
		.label { font-size: 12px; color: var(--muted); }
		.how-head { display: flex; align-items: flex-start; gap: 8px; margin-top: 4px; }
		.how-head:has(#how-title:empty) { display: none; }
		.how-head .helper { margin-top: 1px; }
		#how-title { font-size: 16px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; min-width: 0; }
		#how-title:empty, #how-meta:empty { display: none; }
		#how-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
		#how-helper { font-size: 13px; font-weight: 600; color: var(--accent-ink); margin-top: 4px; }
		#how-life { font-size: 12px; color: var(--muted); margin-top: 6px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; line-height: 1.6; }
		#steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
		.step { display: flex; gap: 12px; }
		.rail { display: flex; flex-direction: column; align-items: center; }
		.mark { width: 22px; height: 22px; border-radius: 999px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; background: var(--ok-bg); color: var(--ok-ink); flex: none; }
		.step.pending .mark { background: var(--accent-bg); color: var(--accent-ink); }
		.step.error .mark { background: var(--bad-bg); color: var(--bad-ink); }
		.step.stopped .mark { background: var(--track); color: var(--muted); font-size: 9px; }
		.rail::after { content: ""; width: 2px; flex: 1; min-height: 14px; background: var(--track); }
		.step-body { padding-bottom: 14px; min-width: 0; flex: 1; }
		.step-title { font-size: 14px; font-weight: 600; }
		.step-detail { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
		.step-detail:empty { display: none; }
		.step details { margin-top: 4px; }
		.step summary { font-size: 12px; color: var(--muted); cursor: pointer; }
		.step .dispatch { padding: 0; }
		.step .dispatch-head { margin-top: 6px; font-size: 12px; font-weight: 600; }
		.step.error .dispatch-head { color: var(--bad-ink); }
		.step .dispatch-task, .step .dispatch-note { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
		.member-steps { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
		.member-step { display: flex; gap: 6px; font-size: 12px; line-height: 1.5; }
		.member-step-mark { flex: none; width: 14px; text-align: center; font-weight: 700; color: var(--ok-ink); }
		.member-step.pending .member-step-mark { color: var(--accent-ink); }
		.member-step.error .member-step-mark { color: var(--bad-ink); }
		.member-step.stopped .member-step-mark { color: var(--muted); font-size: 9px; }
		.member-step-title { flex: none; font-weight: 600; }
		.member-step-detail { min-width: 0; color: var(--muted); overflow-wrap: anywhere; }
		.step .dispatch-reply { margin-top: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.5; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow-wrap: anywhere; max-height: 240px; overflow-y: auto; }
		.bubble.md, .card .latest.md, .step-detail.md { white-space: normal; }
		.step-detail.md { max-height: 240px; overflow-y: auto; }
		.md .md-p { white-space: pre-wrap; }
		.md .md-table { margin-top: 6px; overflow-x: auto; }
		.md table { border-collapse: collapse; font-size: 0.95em; }
		.md th, .md td { padding: 2px 8px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
		.md th { font-weight: 600; background: var(--bg); }
		.md .md-p + .md-p, .md .md-h, .md ul, .md ol { margin-top: 6px; }
		.md > :first-child { margin-top: 0; }
		.md .md-h { font-weight: 600; }
		.md ul, .md ol { margin-bottom: 0; padding-left: 20px; }
		.md ul { list-style: disc; }
		.md ol { list-style: decimal; }
		.md code { font-family: ui-monospace, Menlo, monospace; font-size: 0.92em; padding: 0 3px; border-radius: 4px; background: var(--accent-bg); }
		.step pre { margin: 6px 0 0; padding: 8px 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow-y: auto; }
		#small-print { margin-top: auto; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
		#small-print:empty { display: none; }

		@media (max-width: 900px) {
			.columns { display: flex; flex-direction: column; overflow-y: auto; }
			#left, #how { border: 0; border-bottom: 1px solid var(--line); overflow: visible; }
			#conversation { overflow: visible; padding: 16px; }
			main { min-height: 70vh; }
			header, form, #helpers { padding-left: 16px; padding-right: 16px; }
		}
	</style>
</head>
<body>
	<header>
		<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect class="mark-bg" width="64" height="64" rx="16"></rect><path d="M18 24h28M26 24v18M39 24v14c0 3 1.5 4.5 4 4.5" stroke="#fff" stroke-width="4.5" stroke-linecap="round" fill="none"></path><circle cx="48" cy="16" r="4.5" fill="#f59f00"></circle></svg>
		<div class="brand"><strong>Pi Super Agent</strong><span>你的 24 小时助理</span></div>
		<span id="duty" class="chip"></span>
		<span id="restart" class="chip"></span>
		<span id="status" class="chip" data-status="connecting">连接中…</span>
		<div class="spacer"></div>
		<button id="theme" type="button" aria-label="切换浅色/深色主题"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
	</header>
	<nav id="helpers" aria-label="在岗助手" hidden></nav>
	<div class="columns">
		<aside id="left" aria-label="概况"></aside>
		<main aria-label="对话">
			<div id="conversation"><div class="thread"><div class="welcome">幕僚长持续关注你的消息来源，在后台安排助手处理任务，只在需要你决定时通知你。</div></div></div>
			<form id="say" autocomplete="off">
				<label for="composer" class="sr">新任务</label>
				<div class="composer">
					<textarea id="composer" rows="2" placeholder="描述要做的事，例如：读取 example.com 的网页标题"></textarea>
					<button id="send" type="submit">发送</button>
				</div>
				<div id="say-status" data-state="idle" aria-live="polite">任务在后台进行，完成或需要你决定时会通知你。</div>
			</form>
		</main>
		<aside id="how" aria-label="执行过程">
			<div>
				<div class="label">执行过程</div>
				<div class="how-head"><span id="how-badge"></span><div id="how-title"></div></div>
				<div id="how-helper"></div>
				<div id="how-meta"></div>
				<div id="how-life"></div>
			</div>
			<ol id="steps"></ol>
			<div id="small-print"></div>
		</aside>
	</div>
	<template id="router-avatar"><svg class="avatar" viewBox="0 0 72 72" aria-hidden="true"><circle class="mark-bg" cx="36" cy="36" r="36"></circle><path d="M22 30h28M30 30v16M42 30v12c0 2.5 1.2 4 3.5 4" stroke="#fff" stroke-width="4.5" stroke-linecap="round" fill="none"></path><circle cx="52" cy="20" r="5" fill="#f59f00"></circle></svg></template>
	<template id="helper-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.1-.4-.4-2.1z"></path></svg></template>
	<script type="module" src="/app.mjs?token={{token}}"></script>
</body>
</html>
